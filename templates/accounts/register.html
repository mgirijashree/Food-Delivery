{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto mt-10">

    <div class="bg-white rounded-2xl shadow-xl p-8">

        <h2 class="text-3xl font-bold text-center text-lime-700 mb-8">

            Create Account

        </h2>

        <form method="POST" class="space-y-5">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="w-full bg-lime-700 hover:bg-lime-800 text-white py-3 rounded-xl font-semibold">

                Register

            </button>

        </form>

    </div>

</div>

{% endblock %}

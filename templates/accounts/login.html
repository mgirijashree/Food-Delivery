{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto mt-16">

<div class="bg-white rounded-2xl shadow-xl p-8">

<h2 class="text-3xl font-bold text-center text-lime-700 mb-8">

Login

</h2>

<form method="POST" class="space-y-6">

{% csrf_token %}

<div>

<label class="block mb-2 font-semibold">

Username

</label>

{{ form.username }}

</div>

<div>

<label class="block mb-2 font-semibold">

Password

</label>

{{ form.password }}

</div>

<button

class="w-full bg-lime-700 hover:bg-lime-800 text-white py-3 rounded-xl font-semibold transition">

Login

</button>

</form>

<p class="text-center mt-6">

Don't have an account?

<a href="/accounts/register/"

class="text-lime-700 font-semibold">

Register

</a>

</p>

</div>

</div>

{% endblock %}

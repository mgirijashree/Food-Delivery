{% extends "base.html" %}

{% block title %}
Review Food
{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto px-4 py-10">

    <div class="bg-white rounded-2xl shadow-xl p-8">

        <h1 class="text-3xl font-bold text-center text-lime-700 mb-8">
            ⭐ Review Your Food
        </h1>

        <div class="bg-gray-100 rounded-xl p-5 mb-8">

            <h2 class="text-2xl font-bold">
                {{ food.name }}
            </h2>

            <p class="text-green-700 mt-2 font-semibold">
                ₹ {{ food.price }}
            </p>

        </div>

        <form method="POST" id="reviewForm">

            {% csrf_token %}

            <label class="block font-semibold mb-3">
                Rating
            </label>

            <div class="flex gap-2 mb-2">

                {% for star in stars %}

                <input type="radio" id="star{{ star }}" name="rating" value="{{ star }}" class="hidden">

                <label for="star{{ star }}"
                    class="star text-5xl cursor-pointer text-gray-300 hover:scale-110 transition"
                    data-value="{{ star }}">
                    ★
                </label>

                {% endfor %}

            </div>

            <p id="rating_error" class="text-red-600 text-sm mb-5">
                {{ errors.rating }}
            </p>

            <label class="block font-semibold mb-3">

                Review

            </label>

            <textarea name="comment" id="comment" rows="5"
                class="w-full border rounded-xl p-4 focus:ring-2 focus:ring-lime-500"
                placeholder="Write your experience...(Optional)">{% if review %}{{ review.comment }}{% endif %}</textarea>

            <p id="comment_error" class="text-red-600 text-sm mt-2">
                {{ errors.comment }}
            </p>

            <button class="w-full mt-8 bg-lime-600 hover:bg-lime-700 text-white py-3 rounded-xl font-semibold">

                {% if review %}

                Update Review

                {% else %}

                Submit Review

                {% endif %}

            </button>

        </form>

    </div>

</div>

<script>

    const stars = document.querySelectorAll(".star");

    const radios = document.querySelectorAll("input[name='rating']");

    const form = document.getElementById("reviewForm");

    const comment = document.getElementById("comment");

    function highlight(value) {

        stars.forEach(function (star) {

            if (Number(star.dataset.value) <= value) {

                star.classList.remove("text-gray-300");

                star.classList.add("text-yellow-400");

            }

            else {

                star.classList.remove("text-yellow-400");

                star.classList.add("text-gray-300");

            }

        });

    }

    radios.forEach(function (radio) {

        radio.addEventListener("change", function () {

            highlight(Number(this.value));

            document.getElementById("rating_error").innerHTML = "";

        });

    });

    form.addEventListener("submit", function (e) {

        let valid = true;

        document.getElementById("rating_error").innerHTML = "";

        document.getElementById("comment_error").innerHTML = "";

        comment.classList.remove("border-red-500");

        const rating = document.querySelector("input[name='rating']:checked");

        if (!rating) {

            document.getElementById("rating_error").innerHTML = "Please select a rating.";

            valid = false;

        }

        // Review is optional
        if (
            comment.value.trim() !== "" &&
            comment.value.trim().length < 10
        ) {

            document.getElementById("comment_error").innerHTML =
                "Review must contain at least 10 characters.";

            comment.classList.add("border-red-500");

            valid = false;

        }

        if (!valid) {

            e.preventDefault();

        }

    });

    comment.addEventListener("input", function () {

        document.getElementById("comment_error").innerHTML = "";

        this.classList.remove("border-red-500");

    });

</script>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Delete Restaurant
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto py-20">

    <div class="bg-white shadow-xl rounded-xl p-8 text-center">

        <h2 class="text-3xl font-bold text-red-600">

            Delete Restaurant

        </h2>

        <p class="mt-6 text-lg">

            Are you sure you want to delete

            <strong>{{ restaurant.name }}</strong> ?

        </p>

        <form method="POST">

            {% csrf_token %}

            <button
                class="mt-8 bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg">

                Yes Delete

            </button>

        </form>

        <a
            href="{% url 'restaurant_list' %}"
            class="inline-block mt-5 text-lime-700 font-semibold">

            Cancel

        </a>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="max-w-lg mx-auto py-20">

    <div class="bg-white rounded-2xl shadow-lg p-10 text-center">

        <h2 class="text-3xl font-bold text-red-600">

            Delete Restaurant

        </h2>

        <p class="mt-6">

            Are you sure you want to delete

            <strong>

                {{ restaurant.name }}

            </strong>

            ?

        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="flex justify-center gap-4 mt-8">

                <button
                    class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-xl">

                    Delete

                </button>

                <a
                    href="{% url 'restaurant_list' %}"
                    class="bg-gray-200 hover:bg-gray-300 px-8 py-3 rounded-xl">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
